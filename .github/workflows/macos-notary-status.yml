name: macos-notary-status

# Read-only view of Apple's notary queue for the team: the newest WeftCut
# submissions, the latest one's status, and its log once Apple has a verdict.
# Submits nothing (docs/releases.md §macOS signing).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    if: github.repository == 'WeftCut/WeftCut' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 10
    environment: macos-release
    env:
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - name: Write the API key
        shell: bash
        run: |
          : "${APPLE_API_KEY:?Missing APPLE_API_KEY}"
          : "${APPLE_API_KEY_ID:?Missing APPLE_API_KEY_ID}"
          : "${APPLE_API_ISSUER:?Missing APPLE_API_ISSUER}"
          umask 077
          printf '%s\n' "$APPLE_API_KEY" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Find WeftCut notarization submissions
        id: history
        shell: bash
        run: |
          xcrun notarytool history --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" --output-format json > "$RUNNER_TEMP/notary-history.json"
          python3 - <<'PY'
          import json, os, pathlib
          history = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'notary-history.json').read_text())
          submissions = sorted(
              (item for item in history.get('history', []) if item.get('name', '').startswith('WeftCut')),
              key=lambda item: item['createdDate'], reverse=True,
          )
          print(json.dumps(submissions[:5], indent=2))
          if submissions:
              latest = submissions[0]
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write(f"id={latest['id']}\nstatus={latest['status']}\n")
          else:
              print('No WeftCut submission is recorded by Apple.')
          PY

      - name: Read latest submission status
        if: steps.history.outputs.id != ''
        env:
          SUBMISSION_ID: ${{ steps.history.outputs.id }}
        shell: bash
        run: |
          xcrun notarytool info "$SUBMISSION_ID" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" --output-format json

      - name: Read completed submission log
        if: steps.history.outputs.status == 'Accepted' || steps.history.outputs.status == 'Invalid'
        env:
          SUBMISSION_ID: ${{ steps.history.outputs.id }}
        shell: bash
        run: |
          xcrun notarytool log "$SUBMISSION_ID" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER"

      - name: Remove the API key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
