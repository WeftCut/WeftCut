name: Feature request
description: Something the editor should be able to do and can't.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: >
        Describe the editing problem, not the feature. Knowing what you're actually
        trying to get done often surfaces a better fit than the feature as asked.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you work around it today
      description: In WeftCut, or in whatever editor you'd otherwise reach for.
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: Optional. If another editor does this well, naming it helps.
