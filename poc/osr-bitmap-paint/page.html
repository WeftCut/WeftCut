<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; width: 100%; height: 100%; }
  #surface { position: absolute; left: 0; top: 0; }
  .bit { position: absolute; width: 16px; height: 16px; z-index: 10; }
  .item { position: absolute; width: 180px; height: 70px; border-radius: 12px; font: 600 18px sans-serif;
          color: #fff; box-shadow: 0 6px 18px rgba(0,0,0,.45); will-change: transform; }
  #half { position: absolute; left: 400px; top: 300px; width: 200px; height: 200px; background: rgba(255, 0, 0, .5); }
  #solid { position: absolute; left: 700px; top: 300px; width: 200px; height: 200px; background: rgb(0, 128, 255); }
</style>
</head>
<body>
<script>
const kind = new URLSearchParams(location.search).get('kind');
const BITS = 16;

// Row 0 is DOM on every kind. Row 1 is drawn by the kind's own surface, so a
// canvas the compositor omitted or served stale reads differently from row 0.
const domBits = [];
for (let i = 0; i < BITS; i++) {
  const d = document.createElement('div');
  d.className = 'bit';
  d.style.left = `${i * 20}px`;
  d.style.top = '0px';
  document.body.appendChild(d);
  domBits.push(d);
}

let draw;
let info = { kind };

function barDom(frame) {
  const rowBits = [];
  for (let i = 0; i < BITS; i++) {
    const d = document.createElement('div');
    d.className = 'bit';
    d.style.left = `${i * 20}px`;
    d.style.top = '20px';
    document.body.appendChild(d);
    rowBits.push(d);
  }
  return f => rowBits.forEach((d, i) => { d.style.background = (f >> i) & 1 ? '#fff' : '#000'; });
}

function setupDom() {
  const bar = barDom();
  const items = [];
  for (let i = 0; i < 80; i++) {
    const d = document.createElement('div');
    d.className = 'item';
    d.textContent = `Item ${i}`;
    d.style.background = `hsla(${i * 37 % 360}, 70%, 50%, .8)`;
    document.body.appendChild(d);
    items.push(d);
  }
  draw = f => {
    bar(f);
    items.forEach((d, i) => {
      const x = (i * 97 + f * 7) % (innerWidth - 180);
      const y = 60 + (i * 53 + f * 3) % (innerHeight - 130);
      d.style.transform = `translate(${x}px, ${y}px) rotate(${(f + i) % 30}deg)`;
    });
  };
}

function setupAlpha() {
  const bar = barDom();
  for (const id of ['half', 'solid']) {
    const d = document.createElement('div');
    d.id = id;
    document.body.appendChild(d);
  }
  const mover = document.createElement('div');
  mover.style.cssText = 'position:absolute;left:0;top:600px;width:120px;height:120px;background:rgba(0,255,0,.25)';
  document.body.appendChild(mover);
  draw = f => { bar(f); mover.style.transform = `translateX(${f * 5 % 1200}px)`; };
}

function setupCanvas(options) {
  const c = document.createElement('canvas');
  c.id = 'surface';
  c.width = innerWidth;
  c.height = innerHeight;
  document.body.appendChild(c);
  const g = c.getContext('2d', options);
  const resize = () => { if (c.width !== innerWidth || c.height !== innerHeight) { c.width = innerWidth; c.height = innerHeight; } };
  draw = f => {
    resize();
    g.clearRect(0, 0, c.width, c.height);
    const grad = g.createLinearGradient(0, 0, c.width, c.height);
    grad.addColorStop(0, `hsl(${f * 3 % 360}, 80%, 50%)`);
    grad.addColorStop(1, `hsl(${(f * 3 + 120) % 360}, 80%, 40%)`);
    g.fillStyle = grad;
    g.fillRect(0, 40, c.width, c.height - 40);
    for (let i = 0; i < 400; i++) {
      g.fillStyle = `hsla(${i * 13 % 360}, 80%, 60%, .6)`;
      g.fillRect((i * 41 + f * 9) % c.width, 40 + (i * 29 + f * 5) % (c.height - 40), 40, 40);
    }
    for (let i = 0; i < BITS; i++) {
      g.fillStyle = (f >> i) & 1 ? '#fff' : '#000';
      g.fillRect(i * 20, 20, 16, 16);
    }
  };
}

function setupWebgl() {
  const c = document.createElement('canvas');
  c.id = 'surface';
  c.width = innerWidth;
  c.height = innerHeight;
  document.body.appendChild(c);
  const gl = c.getContext('webgl', { alpha: true, premultipliedAlpha: true, preserveDrawingBuffer: false });
  if (!gl) {
    info.unsupported = 'no webgl context';
    draw = () => {};
    return;
  }
  const dbg = gl.getExtension('WEBGL_debug_renderer_info');
  info.renderer = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
  gl.enable(gl.SCISSOR_TEST);
  const rect = (x, y, w, h, r, g, b, a) => {
    gl.scissor(x, c.height - y - h, w, h);
    gl.clearColor(r * a, g * a, b * a, a);
    gl.clear(gl.COLOR_BUFFER_BIT);
  };
  draw = f => {
    if (c.width !== innerWidth || c.height !== innerHeight) { c.width = innerWidth; c.height = innerHeight; gl.viewport(0, 0, c.width, c.height); }
    gl.disable(gl.SCISSOR_TEST);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.enable(gl.SCISSOR_TEST);
    for (let i = 0; i < 200; i++) {
      rect((i * 41 + f * 9) % c.width, 40 + (i * 29 + f * 5) % (c.height - 80), 60, 60, (i % 7) / 7, (i % 5) / 5, (i % 3) / 3, .7);
    }
    for (let i = 0; i < BITS; i++) {
      const v = (f >> i) & 1 ? 1 : 0;
      rect(i * 20, 20, 16, 16, v, v, v, 1);
    }
  };
}

if (kind === 'dom') setupDom();
else if (kind === 'alpha') setupAlpha();
else if (kind === 'canvas') setupCanvas(undefined);
else if (kind === 'canvasCpu') setupCanvas({ willReadFrequently: true });
else if (kind === 'webgl') setupWebgl();
else throw new Error(`unknown kind ${kind}`);

window.__info = () => info;
window.__render = async (frame, settleRafs) => {
  domBits.forEach((d, i) => { d.style.background = (frame >> i) & 1 ? '#fff' : '#000'; });
  draw(frame);
  for (let i = 0; i < settleRafs; i++) await new Promise(requestAnimationFrame);
  return true;
};
</script>
</body>
</html>
