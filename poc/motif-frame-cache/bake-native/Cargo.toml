[package]
name = "motif-bake-bench"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[build-dependencies]
napi-build = "2"

[dependencies]
anyhow = "1"
blake3 = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
lz4_flex = "0.14"
napi = { version = "3", default-features = false, features = ["napi6", "tokio_rt", "dyn-symbols"] }
napi-derive = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }
