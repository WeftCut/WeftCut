appId: dev.weftcut.desktop
productName: WeftCut
executableName: WeftCut
# OS + arch, no version: GitHub's releases/latest/download/<asset> URL then always
# resolves to the current build, so a download page never embeds a version. An
# exact build stays addressable through its tag (releases/download/v<version>/
# <asset>), and electron-updater derives the previous blockmap URL by swapping the
# version inside that tag segment, so differential Windows updates still work.
# Expands to WeftCut-win-x64.exe, WeftCut-linux-x86_64.AppImage,
# WeftCut-linux-amd64.deb and WeftCut-mac-arm64.dmg; release.mjs pins that set.
artifactName: ${productName}-${os}-${arch}.${ext}
publish:
  provider: github
  owner: WeftCut
  repo: WeftCut
  releaseType: release
# Pack-time gates, re-asserted from the packaged files rather than from what the
# supply steps believed they staged: both ffmpeg lanes' licensing compliance, and
# the presence of the agent skill bundle. Each refuses to let the build become a
# distributable; see scripts/after-pack.mjs.
afterPack: ./scripts/after-pack.mjs
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - "!**/*.map"
  - "!**/node_modules/@weftcut/core/**"
  - "**/node_modules/@weftcut/core/index.js"
  - "**/node_modules/@weftcut/core/index.d.ts"
  - "**/node_modules/@weftcut/core/*.node"
  - "!**/node_modules/@weftcut/native-decode/**"
  - "**/node_modules/@weftcut/native-decode/index.js"
  - "**/node_modules/@weftcut/native-decode/index.d.ts"
  - "**/node_modules/@weftcut/native-decode/*.node"
  # Linux + macOS: the co-located LGPL libav*/libsw* shared objects (+ their
  # SONAME symlink chains) that the addon's baked rpath (DT_RPATH $ORIGIN on
  # Linux, @loader_path on macOS) resolves at dlopen. On Windows the runtime is
  # DLLs shipped as extraResources (win: block) instead, so these globs simply
  # match nothing there. (*.dylib also matches the versioned libX.NN.dylib
  # chain links, so one glob covers macOS.)
  - "**/node_modules/@weftcut/native-decode/*.so"
  - "**/node_modules/@weftcut/native-decode/*.so.*"
  - "**/node_modules/@weftcut/native-decode/*.dylib"
asarUnpack:
  - "**/*.node"
  # $ORIGIN/@loader_path resolves against the .node's on-disk directory, which
  # only exists once the shared objects are unpacked out of the asar archive
  # beside it — inside app.asar there is no real directory for the loader to
  # search.
  - "**/node_modules/@weftcut/native-decode/*.so"
  - "**/node_modules/@weftcut/native-decode/*.so.*"
  - "**/node_modules/@weftcut/native-decode/*.dylib"
extraResources:
  # The weftcut-mcp stdio shim (single self-contained bundle, built by
  # scripts/build-cli.mjs). The app copies it to <userData>/cli/ at startup —
  # THAT copy is what client configs reference (stable across upgrades, and
  # the only stable option on AppImage); this one is just the ride-along.
  - from: out/cli
    to: cli
  # The agent skill folder (assembled by scripts/build-skills.mjs from the repo's
  # skills/ tree + the docs it points at). Refreshed into <userData>/skills/ at
  # startup; the user copies THAT into their agent's own skills directory, so this
  # one is only the ride-along. A filter that stopped matching would pack nothing
  # without complaining — the afterPack skill gate is what catches that.
  - from: out/skills
    to: skills
    filter: ["**/*"]
  # GPL ffmpeg/ffprobe sidecar binaries + their compliance materials
  # (manifest.json + SOURCE-OFFER.txt, staged by fetch-ffmpeg.mjs). The GPLv3
  # license text rides from the repo-tracked copy below; after-pack-licensing.mjs
  # asserts the full set at pack time.
  - from: resources/ffmpeg/${os}
    to: ffmpeg
    filter: ["**/*", "!.gitkeep"]
  - from: resources/licenses/GPL-3.0.txt
    to: ffmpeg/LICENSE.txt
  - from: src/shared/motifs/builtin
    to: motifs/builtin
    filter: ["**/*"]
# App icon. build/icon.png is the 1024x1024 raster master, generated from the
# canonical brand SVG (src/renderer/public/icons/icon.svg) by `npm run
# gen:icons`. electron-builder derives the multi-resolution Windows .ico, the
# macOS .icns, and the Linux png set from this one master — re-run gen:icons
# after any palette tweak to the SVG. The derived multi-resolution .ico is what
# the exe embeds and what the Windows taskbar draws; the in-app window icon
# (src/main/index.ts, set whenever !app.isPackaged) is the runtime backstop.
win:
  target: [nsis]
  icon: build/icon.png
  extraResources:
    # LGPL ffmpeg runtime for @weftcut/native-decode (dynamic linking + separate
    # files satisfies LGPL §6; LICENSE + manifest.json carry the notice + exact
    # source pointer). *.dll only — the exes in bin/ are fetch-time tooling.
    - from: resources/ffmpeg-lgpl/win/bin
      to: native-decode
      filter: ["*.dll"]
    - from: resources/ffmpeg-lgpl/win/LICENSE.txt
      to: native-decode/LICENSE.txt
    - from: resources/ffmpeg-lgpl/win/manifest.json
      to: native-decode/manifest.json
# build/installer.nsh (auto-detected, no `include:` key needed) adds a
# customInstall macro that re-stamps the shortcut AppUserModelID on every install
# AND in-place update — the stock macros skip it when a kept shortcut's name is
# unchanged, which is what leaves the taskbar icon blank after an auto-update.
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target: [AppImage, deb]
  icon: build/icon.png
  category: AudioVideo
  extraResources:
    # LGPL §6 obligations for @weftcut/native-decode's ffmpeg runtime. The .so
    # themselves ride co-located beside the .node (files + asarUnpack above) so
    # $ORIGIN resolves in the packaged app exactly as in dev; here we only carry
    # the license notice + build manifest (the exact source pointer + banner).
    # Placed under resources/native-decode/ to mirror the win: layout and to
    # give the afterPack LGPL re-check a stable, platform-uniform path to read.
    - from: resources/ffmpeg-lgpl/linux/LICENSE.txt
      to: native-decode/LICENSE.txt
    - from: resources/ffmpeg-lgpl/linux/manifest.json
      to: native-decode/manifest.json
    # MIT (Expat) notice for the bundled libva (>= 2.21, VAAPI copy-back — issue
    # #5 Block C). Like the libav*.so, libva.so.2 + libva-drm.so.2 ride co-located
    # beside the .node via files/asarUnpack; this carries its license text.
    - from: resources/ffmpeg-lgpl/linux/LIBVA-LICENSE.txt
      to: native-decode/LIBVA-LICENSE.txt
mac:
  # DMG only, arm64 only: the CI runner, the bundled ffmpeg sidecar
  # (fetch-ffmpeg.mjs §mac) and the from-source LGPL libraries are all Apple
  # Silicon, so there is no Intel build to offer. No zip target either — that
  # exists to feed electron-updater, which macOS cannot use (below).
  target: [dmg]
  category: public.app-category.video
  icon: build/icon.png
  # Electron 44 dropped macOS 12; the bundled runtime will not start below 13,
  # so the DMG declares the same floor instead of failing at launch.
  minimumSystemVersion: "13.0"
  # Ad-hoc signature (`codesign --sign -`): no Developer ID, no notarization —
  # the project has no paid Apple developer account. Ad-hoc is deliberately NOT
  # `identity: null`. electron-builder starts from Electron's own ad-hoc-signed
  # bundle and then rewrites Info.plist, renames the helpers and adds app.asar,
  # so skipping signing ships a signature whose seal no longer matches the
  # bundle — Gatekeeper reports that as "damaged", and only `xattr` gets past
  # it. Re-signing ad-hoc inside-out (osx-sign, through electron-builder's own
  # "-" identity path) yields a self-consistent signature, which Gatekeeper
  # treats as an unidentified developer instead: open once, then Privacy &
  # Security → Open Anyway. The hardened runtime stays on; electron-builder's
  # default entitlements carry the disable-library-validation flag that ad-hoc
  # signing needs under it (its own warning names that flag).
  #
  # What ad-hoc cannot do is self-update: Squirrel.Mac installs only an update
  # whose signature satisfies the running app's designated requirement, and an
  # ad-hoc requirement is that build's own code hash, so no later build ever
  # matches. main disables electron-updater on darwin (docs/releases.md); the
  # release notes carry the Gatekeeper steps. A Developer ID lifts both limits.
  identity: "-"
  notarize: false
  extraResources:
    # LGPL §6 obligations for @weftcut/native-decode's ffmpeg runtime. The
    # .dylib themselves ride co-located beside the .node (files + asarUnpack
    # above) so @loader_path resolves in the packaged app exactly as in dev;
    # here we only carry the license notice + build manifest (the exact source
    # pointer + banner). Placed under resources/native-decode/ to mirror the
    # win:/linux: layout and to give the afterPack LGPL re-check a stable,
    # platform-uniform path to read.
    - from: resources/ffmpeg-lgpl/mac/LICENSE.txt
      to: native-decode/LICENSE.txt
    - from: resources/ffmpeg-lgpl/mac/manifest.json
      to: native-decode/manifest.json
