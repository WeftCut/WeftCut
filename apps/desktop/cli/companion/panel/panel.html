<main id="companion"></main>
<script>
(() => {
  // cli/companion/ui/viewState.js
  function pageState(input) {
    const { link, editorRefused, state } = input;
    if (link === "revoked") return "revoked";
    if (link === "offline") return "offline";
    if (state === null) return "connecting";
    if (editorRefused || state.project !== null && state.editor !== "ready") return "opening";
    if (state.project === null) return "no_project";
    return "ready";
  }
  function pictureState(input) {
    if (input.exporting) return "export";
    if (!input.wanted) return "off";
    if (!input.supported) return "unsupported";
    if (input.failed) return "failed";
    if (input.blocked) return "blocked";
    if (input.minimized) return "minimized";
    if (!input.shown) return "starting";
    return "live";
  }
  function exportRunning(job) {
    return job != null && !["completed", "failed", "cancelled", "awaiting_retry"].includes(job.state);
  }
  function exportShown(job) {
    return exportRunning(job) || job?.state === "completed" || job?.state === "failed";
  }
  var CALLS_KEPT = 4;
  function recordCall(calls, activity, at) {
    if (activity === null) return calls;
    const head = calls[0];
    const sameRunning = head !== void 0 && head.state === "running" && head.client === activity.client && head.tool === activity.tool;
    return [{ client: activity.client, tool: activity.tool, state: activity.state, at }, ...sameRunning ? calls.slice(1) : calls].slice(0, CALLS_KEPT);
  }

  // cli/companion/ui/timeline.js
  function timelineRows(tracks) {
    const rows = [];
    tracks.forEach((track, i) => {
      if (track.clips.length === 0) return;
      const audio = track.clips.every((c) => c.kind === "Audio");
      rows.push({ key: track.track_id, label: `${audio ? "A" : "V"}${i + 1}`, clips: track.clips });
    });
    return rows.reverse();
  }
  function clipBox(clip, durationUs) {
    const d = Math.max(1, durationUs);
    return {
      left: clip.t_start_us / d * 100,
      width: Math.max(MIN_CLIP_PERCENT, (clip.t_end_us - clip.t_start_us) / d * 100)
    };
  }
  var MIN_CLIP_PERCENT = 0.3;
  function timeAt(clientX, left, width, durationUs) {
    if (width <= 0) return 0;
    const f = Math.min(1, Math.max(0, (clientX - left) / width));
    return Math.round(f * durationUs);
  }

      if (pc.iceGatheringState === "complete") return Promise.resolve();
      return new Promise((resolve) => {
        const timer = timers.setTimeout(resolve, GATHER_MAX_MS);
        pc.onicegatheringstatechange = () => {
          if (pc.iceGatheringState !== "complete") return;
          timers.clearTimeout(timer);
          resolve();
        };
      });
    }
  }

  // cli/companion/panel/transportToolcall.js
  var LAUNCH_TIMEOUT_MS = 6e4;
  function toolcallTransport({ bridge: bridge2, syncTool, clock, codecs = null, Peer = null, doc = globalThis.document }) {
    let handlers = null;
    let stopped = false;
    let wake = () => {
    };
    function record(result) {
      if (result?.isError) throw new Error(result.content?.[0]?.text ?? "the tool failed");
      if (result?.structuredContent !== void 0) return result.structuredContent;
      return JSON.parse(result?.content?.[0]?.text ?? "null");
    }
    const sync = async (args) => record(await bridge2.callTool(syncTool, args));
    async function readState() {
      handlers.state(await sync({ op: "state" }));
    }
    async function session(reached) {
      let cursor = await sync({ op: "events" });
      await readState();
      reached();
      handlers.link("online");
      while (!stopped) {
        const answer = await sync({ op: "events", since: cursor.seq, stream: cursor.stream });
        cursor = answer;
        if (stopped) return;
        if (answer.reset) {
          await readState();
          continue;
        }
        let reread = false;
        for (const { name, data } of answer.events) {
          if (name === "project" || name === "editor") reread = true;
          else handlers.event(name, data);
        }
        if (reread) await readState();
      }
    }
    function pause(ms) {
      return new Promise((resolve) => {
        wake = resolve;
        void clock.sleep(ms).then(resolve);
      });
    }
    async function run() {
      let wait = RETRY_FIRST_MS;
      while (!stopped) {
        try {
          await session(() => {
            wait = RETRY_FIRST_MS;
          });
        } catch {
        }
        if (stopped) return;
        handlers.link("offline");
        await pause(wait);
        wait = Math.min(wait * 2, RETRY_MAX_MS);
      }
    }
    async function call(name, args, timeoutMs) {
      try {
        return { ok: true, value: record(await bridge2.callTool(name, args, timeoutMs)) };
      } catch {
        return { ok: false, value: null };
      }
    }
    return {
      /** Starts reading; returns the stop. */
      start(h) {
        handlers = h;
        handlers.link("connecting");
        void run();
        return () => {
          stopped = true;
          wake();
        };
      },
      /** The picture, as `transportLoopback.js` opens it, plus `view.blocked()`
       *  when it cannot reach this view. Null where it cannot be shown. */
      openPicture(view) {
        if (codecs === null || Peer === null || stopped) return null;
        return openPeerPicture({
          signal: (offer) => sync({ op: "signal", offer }),
          codecs,
          Peer,
          doc,
          clock
        }, view);
      },
      /** A player control or `focus`: `ok`, `not_ready`, `invalid`, or
       *  `offline` when the app could not be asked. */
      async control(action) {
        const { ok, value } = await call(syncTool, { op: "control", ...action });
        return ok ? value.outcome : "offline";
      },
      /** Starts WeftCut and resumes at once once it is up: `ok` or `failed`. */
      async launch() {
        const { ok } = await call("launch_weftcut", {}, LAUNCH_TIMEOUT_MS);
        wake();
        return ok ? "ok" : "failed";
      },
      /** The project the app lists first among its recent ones, `{ name, path }`,
       *  or null. */
      async recentProject() {
        const { ok, value } = await call("read_project", { view: "session" });
        const recent = ok ? value?.recent_projects?.[0] : void 0;
        return recent && typeof recent.path === "string" ? { name: String(recent.name ?? ""), path: recent.path } : null;
      },
      /** Opens `path` in the app: `ok` or `failed`. The state that follows
       *  arrives as for any other change. */
      async openProject(path) {
        const { ok } = await call("open_project", { path });
        return ok ? "ok" : "failed";
      }
    };
  }

  // cli/companion/panel/panel.js
  var HANDSHAKE_WAIT_MS = 3e3;
  var bridge = mcpAppsBridge({
    post: (message) => window.parent.postMessage(message, "*"),
    subscribe: (listener) => {
      const onMessage = (event) => {
        if (event.source === window.parent) listener(event.data);
      };
      window.addEventListener("message", onMessage);
      return () => window.removeEventListener("message", onMessage);
    }
  });
  var handshake = bridge.initialize({ name: "weftcut-side-preview", version: "1" }).catch(() => ({}));
  var waited = new Promise((resolve) => {
    setTimeout(() => resolve({}), HANDSHAKE_WAIT_MS);
  });
  void Promise.race([handshake, waited]).then((context) => {
    const page = mountCompanion(
      document.getElementById("companion"),
      toolcallTransport({
        bridge,
        syncTool: entry_default.sync.name,
        clock: { sleep: (ms) => new Promise((resolve) => {
          setTimeout(resolve, ms);
        }) },
        codecs: typeof VideoDecoder === "undefined" ? null : { VideoDecoder, EncodedVideoChunk },
        Peer: typeof RTCPeerConnection === "undefined" ? null : RTCPeerConnection
      }),
      { locale: context?.hostContext?.locale ?? navigator.language, icon: icon_default }
    );
    bridge.onRequest("ui/resource-teardown", () => {
      page.stop();
      return {};
    });
  });
  var reported = "";
  new ResizeObserver(() => {
    const { scrollWidth: width, scrollHeight: height } = document.documentElement;
    if (`${width}x${height}` === reported) return;
    reported = `${width}x${height}`;
    bridge.sizeChanged(width, height);
  }).observe(document.documentElement);
})();
</script>
